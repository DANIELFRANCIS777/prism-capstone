name: CI

on:
  push:
    branches: [main, "product/**"]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push makes an in-flight run for the same branch irrelevant.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: prism
          POSTGRES_PASSWORD: prism
          POSTGRES_DB: prism
        ports: ["5432:5432"]
        # Without this the suite can start before Postgres accepts
        # connections and fail on the first fixture rather than on a real
        # defect.
        options: >-
          --health-cmd "pg_isready -U prism"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://prism:prism@localhost:5432/prism
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Run tests
        working-directory: backend
        run: pytest -q
      - name: Check migrations match the models
        working-directory: backend
        # The suite already runs migrations; this catches a models.py edit
        # that shipped without a matching revision.
        run: alembic check

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Build
        working-directory: frontend
        run: npm run build

  integration:
    name: End-to-end verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Start the full stack
        run: docker compose up -d --build

      - name: Wait for the gateway to be ready
        # /ready (not /health) because it also proves Postgres is reachable -
        # the thing every data-plane request actually needs.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/ready > /dev/null; then
              echo "ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "gateway never became ready"; docker compose logs gateway; exit 1

      - name: Validate the data pack
        run: python3 scripts/validate_pack.py

      - name: Smoke test (API and header contract)
        run: python3 scripts/smoke_test.py --url http://localhost:8080 --key prism-sk-search-1a2b3c --model fast

      - name: Load test (rate-limit admission and accounting)
        run: |
          python3 scripts/load_test.py --url http://localhost:8080 \
            --key prism-sk-free-7g8h9i --model fast \
            --requests 30 --concurrency 10 --rpm-limit 10

      - name: Routing eval
        run: docker compose exec -T gateway python scripts/routing_eval.py

      - name: Model discovery is scoped to the calling key
        # The search key's allowlist is ["fast"], so anything else appearing
        # here means the per-key scoping regressed.
        run: |
          ids=$(curl -sf http://localhost:8080/v1/models \
            -H "Authorization: Bearer prism-sk-search-1a2b3c" \
            | python3 -c "import json,sys; print(','.join(m['id'] for m in json.load(sys.stdin)['data']))")
          echo "search key sees: $ids"
          [ "$ids" = "fast" ] || { echo "expected exactly 'fast'"; exit 1; }

      - name: Gateway logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v

  containers:
    name: Production images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the backend image
        run: docker build -f backend/Dockerfile -t prism-backend:ci .
      - name: Confirm the backend image does not run as root
        run: |
          user=$(docker run --rm --entrypoint sh prism-backend:ci -c 'id -un')
          echo "backend runs as: $user"
          [ "$user" != "root" ] || { echo "image runs as root"; exit 1; }
      - name: Build the production console image
        working-directory: frontend
        run: docker build -f Dockerfile.prod -t prism-frontend:ci --build-arg VITE_API_BASE_URL=https://example.invalid .

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    # Advisory for now: a new CVE in a transitive dependency shouldn't block
    # an unrelated merge. Promote to blocking once the current findings are
    # triaged.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install pip-audit
      - name: Audit Python dependencies
        run: pip-audit -r backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high
