server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The console is a single-page app with client-side view switching, so
    # any unmatched path has to fall back to index.html rather than 404 -
    # otherwise a refresh on any view breaks.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Vite emits content-hashed filenames, so these can be cached hard.
    # Only add_header here, no `expires` - that directive emits its own
    # Cache-Control and you end up sending the header twice. Security
    # headers repeated for the same non-inheritance reason as below;
    # nosniff matters most on the JS bundle.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # index.html must never be cached: it's what points at the current
    # hashed bundle, so a stale copy pins users to a deleted build.
    #
    # The security headers are repeated here on purpose. nginx's add_header
    # does not merge across levels - a location block that sets any header
    # of its own discards every add_header inherited from the server block.
    # Since try_files internally redirects "/" into this exact-match
    # location, omitting them here silently strips them from the console's
    # main entry point (verified: they were missing until this was added).
    location = /index.html {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # The console renders untrusted-ish content (log rows, model names) and
    # holds JWTs in localStorage, so keep the obvious headers on.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
